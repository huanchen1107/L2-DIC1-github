<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huan Chen - Live Date & Time</title>
    <!-- Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090a0f;
            --card-base: rgba(13, 16, 27, 0.45);
            --card-border: rgba(255, 255, 255, 0.05);
            --accent-glow: rgba(99, 102, 241, 0.15);
            --accent-primary: #818cf8;
            --accent-secondary: #38bdf8;
            --text-primary: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Interactive animated grid background */
        .grid-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        /* Ambient colored glows */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
            animation: float 25s infinite alternate ease-in-out;
        }

        .glow-indigo {
            top: -150px;
            left: -100px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
        }

        .glow-cyan {
            bottom: -200px;
            right: -100px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, transparent 70%);
            animation-delay: -12s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.1); }
        }

        /* Main glass card */
        .glass-card {
            background: var(--card-base);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 4rem 3.5rem;
            width: 90%;
            max-width: 580px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 
                0 4px 30px rgba(0, 0, 0, 0.4),
                0 0 80px rgba(129, 140, 248, 0.03);
            text-align: center;
            z-index: 1;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            transform: translateY(-8px);
            border-color: rgba(129, 140, 248, 0.2);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                0 0 100px rgba(129, 140, 248, 0.08);
        }

        /* Decorative top badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(129, 140, 248, 0.08);
            border: 1px solid rgba(129, 140, 248, 0.15);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-primary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent-secondary);
            box-shadow: 0 0 8px var(--accent-secondary);
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Greeting & Name */
        .intro-text {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .user-name {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 40%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        /* Clock Display */
        .clock-wrapper {
            margin: 2.5rem 0;
            position: relative;
        }

        .clock-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 4rem;
            font-weight: 500;
            letter-spacing: -0.05em;
            color: #ffffff;
            line-height: 1;
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 4px;
        }

        .clock-seconds {
            font-size: 1.75rem;
            color: var(--accent-primary);
            font-weight: 400;
            margin-left: 4px;
        }

        .clock-period {
            font-family: 'Inter', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-left: 8px;
            letter-spacing: 0.05em;
        }

        /* Date display */
        .calendar-display {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-top: 1rem;
            letter-spacing: 0.01em;
        }

        /* Custom separator line */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06) 20%, rgba(255, 255, 255, 0.06) 80%, transparent);
            margin: 2rem 0;
        }

        /* Footer system status */
        .system-status {
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            color: rgba(100, 116, 139, 0.5);
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <!-- Visual background layouts -->
    <div class="grid-background"></div>
    <div class="glow glow-indigo"></div>
    <div class="glow glow-cyan"></div>

    <!-- Center Card -->
    <div class="glass-card">
        <!-- Top status badge -->
        <div class="badge">
            <span class="badge-dot"></span>
            Live Node Connection
        </div>

        <p class="intro-text">hello, my name:</p>
        <h1 class="user-name">Huan Chen</h1>

        <div class="divider"></div>

        <!-- High precision real-time clock -->
        <div class="clock-wrapper">
            <div class="clock-display">
                <span id="hours">00</span>:<span id="minutes">00</span><span class="clock-seconds" id="seconds">.00</span><span class="clock-period" id="period">AM</span>
            </div>
            
            <!-- Calendar Date -->
            <div class="calendar-display" id="date">
                Loading Calendar...
            </div>
        </div>

        <div class="divider"></div>

        <div class="system-status">
            STATUS // SECURE SYSTEM SYNC ACTIVE
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // Format elements
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const period = hours >= 12 ? 'PM' : 'AM';
            
            // Convert to 12-hour format
            hours = hours % 12;
            hours = hours ? hours : 12; // 0 is 12
            const hoursStr = String(hours).padStart(2, '0');
            
            // Render clock elements
            document.getElementById('hours').textContent = hoursStr;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = '.' + seconds;
            document.getElementById('period').textContent = period;

            // Render calendar elements: Day, Month Date, Year
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }

        // Live cycle execution
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
